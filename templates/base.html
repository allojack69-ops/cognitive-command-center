<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b10">
<title>{% block title %}Universe Lab{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}?v=20">
</head>
<body>
<div id="universe-bg-layer" class="universe-bg-layer" aria-hidden="true"
     style="background-image:url('{{ url_for('static', filename='universe/universe_bg_acrylic.png') }}?v=18')"></div>
<div class="universe-bg-veil" aria-hidden="true"></div>
<header>
  <div class="nav public-nav-shell">
    <a class="brand" href="{{url_for('index')}}">◉ UNIVERSE LAB</a>
    <nav class="public-nav" aria-label="Primary">
      <a href="{{url_for('universe_public.test_ai')}}">Test AI</a>
      <a href="{{url_for('universe_public.experiments')}}">Experiments</a>
      <a href="{{url_for('universe_lab.home')}}">Lab</a>
      <a href="{{url_for('universe_public.research')}}">Research</a>
    </nav>
  </div>
</header>
<main class="wrap">
{% with messages=get_flashed_messages(with_categories=true) %}
{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<footer>
  <div class="wrap public-footer">
    <div>
      <b>UNIVERSE LAB</b>
      <span>Human × AI × State × History × Field</span>
    </div>
    <div class="footer-links">
      <a href="{{url_for('universe_public.experiments')}}">Experiments</a>
      <a href="{{url_for('universe_public.research')}}">Research</a>
      <a href="{{url_for('universe_lab.data_home')}}">Data</a>
    </div>
  </div>
</footer>
<script>
function copyFrom(id,btn){
 const el=document.getElementById(id);
 navigator.clipboard.writeText(el.value).then(()=>{
   const old=btn.textContent;
   btn.textContent='Copied ✓';
   setTimeout(()=>btn.textContent=old,1400);
 });
}
</script>

<script>
(function () {
  // Admin analytics only: refresh automatically every 30 seconds.
  // Pauses while the tab is hidden to avoid needless requests.
  const isAnalytics = window.location.pathname === "/admin/analytics";
  if (!isAnalytics) return;

  let timer = null;

  function schedule() {
    if (timer) clearInterval(timer);
    if (!document.hidden) {
      timer = setInterval(() => {
        window.location.reload();
      }, 30000);
    }
  }

  document.addEventListener("visibilitychange", schedule);
  schedule();
})();
</script>

</body>
</html>
